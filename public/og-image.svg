    <path d="M18 106a34 34 0 0 1 34-34h324a34 34 0 0 1 34 34v62H18z" fill="#526f98"/>
    <path d="M119 48v62m190-62v62" stroke="#526f98" stroke-width="20" stroke-linecap="round"/>
    <text x="54" y="137" fill="#f9fbff" font-family="DM Sans, Arial, sans-serif" font-size="24" font-weight="600">OCTOBER 2026</text>
    <g fill="#829ab9" font-family="DM Sans, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle">
      <text x="55" y="218">S</text><text x="108" y="218">M</text><text x="161" y="218">T</text><text x="214" y="218">W</text><text x="267" y="218">T</text><text x="320" y="218">F</text><text x="373" y="218">S</text>
    </g>
    <g fill="#334d70" font-family="DM Sans, Arial, sans-serif" font-size="20" text-anchor="middle">
      <text x="55" y="272">4</text><text x="108" y="272">5</text><text x="161" y="272">6</text><text x="214" y="272">7</text><text x="267" y="272">8</text><text x="320" y="272">9</text><text x="373" y="272">10</text>
      <text x="55" y="328">11</text><text x="108" y="328">12</text><text x="161" y="328">13</text><text x="214" y="328">14</text><text x="267" y="328">15</text><text x="320" y="328">16</text><text x="373" y="328">17</text>
      <text x="55" y="384">18</text><text x="108" y="384">19</text><text x="161" y="384">20</text><text x="214" y="384">21</text><text x="267" y="384">22</text><text x="320" y="384">23</text><text x="373" y="384">24</text>
      <text x="55" y="440">25</text><text x="108" y="440">26</text><text x="161" y="440">27</text><text x="214" y="440">28</text>
    </g>
    <circle cx="267" cy="434" r="24" fill="#dce7f5"/>
    <text x="267" y="441" fill="#334d70" font-family="DM Sans, Arial, sans-serif" font-size="20" text-anchor="middle">29</text>
    <circle cx="320" cy="434" r="25" fill="#d4a85d"/>
    <text x="320" y="441" fill="#fff" font-family="DM Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">30</text>
    <text x="373" y="440" fill="#334d70" font-family="DM Sans, Arial, sans-serif" font-size="20" text-anchor="middle">31</text>
  </g>

  <g transform="translate(1145 468)">
    <ellipse cx="0" cy="0" rx="46" ry="15" fill="none" stroke="#9db2cf" stroke-width="3" transform="rotate(-26)"/>
    <circle cx="-4" cy="0" r="27" fill="url(#planet)" stroke="#7e98ba" stroke-width="3"/>
    <circle cx="-13" cy="-10" r="20" fill="#e8eef8" opacity=".78"/>
    <circle cx="33" cy="-24" r="7" fill="#d4a85d"/>
    <path d="m-7-107 4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#d4a85d"/>
  </g>
