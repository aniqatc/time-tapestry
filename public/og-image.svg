<!-- Purpose: Provides the vector source for the social sharing image. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Time Tapestry</title>
  <desc id="description">A calendar for birthdays, notable dates, and astronomy.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8faff"/>
      <stop offset="1" stop-color="#e7edf7"/>
    </linearGradient>
    <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dce8f8"/>
      <stop offset="1" stop-color="#9eb4d3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#405a7b" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1050" cy="105" r="180" fill="#fff" opacity=".28"/>
  <circle cx="1090" cy="570" r="240" fill="#dbe5f3" opacity=".42"/>

  <g transform="translate(86 100)">
    <rect width="56" height="56" rx="16" fill="#e4ecf8" stroke="#c8d8ed" stroke-width="2"/>
    <path d="M14 19v-5m28 5v-5M10 24h36v21H10z" fill="none" stroke="#526f98" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="21" cy="33" r="2.7" fill="#d4a85d"/><circle cx="29" cy="33" r="2.7" fill="#738fb9"/><circle cx="37" cy="33" r="2.7" fill="#738fb9"/>
    <text x="76" y="37" fill="#526f98" font-family="DM Sans, Arial, sans-serif" font-size="25" font-weight="700" letter-spacing=".2">TIME TAPESTRY</text>
  </g>

  <text x="86" y="270" fill="#233b5c" font-family="DM Sans, Arial, sans-serif" font-size="60" font-weight="700" letter-spacing="-2">A little more meaning</text>
  <text x="86" y="348" fill="#233b5c" font-family="DM Sans, Arial, sans-serif" font-size="60" font-weight="700" letter-spacing="-2">to every date.</text>
  <text x="90" y="414" fill="#5f7da7" font-family="DM Sans, Arial, sans-serif" font-size="26" font-weight="400">Birthdays, history, and a little astronomy.</text>

  <g transform="translate(86 482)">
    <rect width="322" height="48" rx="24" fill="#e0e9f5"/>
    <text x="22" y="31" fill="#526f98" font-family="DM Sans, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1">CALENDAR  ·  COMMUNITY  ·  COSMOS</text>
  </g>

  <g transform="translate(694 76)" filter="url(#shadow)">
